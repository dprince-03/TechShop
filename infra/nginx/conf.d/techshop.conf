# Local development routing. Each hostname proxies to a dev server on the host.
# *.localhost resolves to 127.0.0.1 in browsers without editing /etc/hosts.

# corporate
server {
  listen 80;
  server_name techshop.localhost;

  location / {
    proxy_pass http://host.docker.internal:3000;
    include /etc/nginx/conf.d/proxy-params.inc;
  }
}

# market
server {
  listen 80;
  server_name market.techshop.localhost;

  location / {
    proxy_pass http://host.docker.internal:3001;
    include /etc/nginx/conf.d/proxy-params.inc;
  }
}

