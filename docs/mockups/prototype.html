<title>TechShop Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one shared state, seven apps. Web apps render in a browser frame, mobile apps in a phone frame.
   Tokens mirror shared/design-tokens (TechShop's real design system). */
:root{
  --bg:#ffffff; --surface:#f4f5f7; --raised:#ffffff; --inverse:#111214;
  --text:#16171a; --muted:#5f6368; --subtle:#6b7078; --text-inverse:#f7f8fa;
  --border:#d9dbe0; --border-strong:#8e939b;
  --accent:#1a56f0; --accent-hover:#1546c8; --accent-subtle:#e8efff; --on-accent:#ffffff; --link:#1a56f0;
  --sale:#d1242f; --promo:#c2410c; --sale-fill:#d1242f; --promo-fill:#c2410c; --on-fill:#ffffff;
  --rating:#f5a524; --success:#1a7f37; --warning:#9a6700; --danger:#d1242f;
  --chrome:#e9ebef; --stage:#eceef2;
  --shadow:0 4px 16px rgb(0 0 0 / .08); --shadow-lg:0 12px 32px rgb(0 0 0 / .14);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:28px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0e; --surface:#16181c; --raised:#1d2025; --inverse:#f4f5f7;
  --text:#f2f3f5; --muted:#a3a8b0; --subtle:#8d939b; --text-inverse:#16171a;
  --border:#2c3036; --border-strong:#5b616a;
  --accent:#2563eb; --accent-hover:#3b74f5; --accent-subtle:#16244a; --link:#6b9bff;
  --sale:#ff6b6b; --promo:#fb8c4b; --success:#4ac26b; --warning:#e3b341; --danger:#ff6b6b;
  --chrome:#1a1c20; --stage:#08090a;
  --shadow:0 4px 16px rgb(0 0 0 / .45); --shadow-lg:0 12px 32px rgb(0 0 0 / .55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --surface:#16181c; --raised:#1d2025; --inverse:#f4f5f7;
  --text:#f2f3f5; --muted:#a3a8b0; --subtle:#8d939b; --text-inverse:#16171a;
  --border:#2c3036; --border-strong:#5b616a;
  --accent:#2563eb; --accent-hover:#3b74f5; --accent-subtle:#16244a; --link:#6b9bff;
  --sale:#ff6b6b; --promo:#fb8c4b; --success:#4ac26b; --warning:#e3b341; --danger:#ff6b6b;
  --chrome:#1a1c20; --stage:#08090a;
  --shadow:0 4px 16px rgb(0 0 0 / .45); --shadow-lg:0 12px 32px rgb(0 0 0 / .55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .subtle{color:var(--subtle)} .xs{font-size:12px} .sm{font-size:13.5px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Prototype chrome ---------- */
.proto{display:flex;flex-direction:column;min-height:100vh;padding-inline:16px;padding-block:12px 32px;gap:12px;max-width:1500px;margin:0 auto}
.proto-top>.row{min-width:0;max-width:100%}.proto-top>.row:last-child{flex-wrap:nowrap}
.proto-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--inverse);display:grid;place-items:center}
.mark svg{stroke:var(--text-inverse)}
.switcher{min-width:0;display:flex;gap:4px;padding:4px;background:var(--raised);border:1px solid var(--border);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.switcher button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.switcher button[aria-pressed="true"]{background:var(--inverse);color:var(--text-inverse)}
.switcher button:hover:not([aria-pressed="true"]){color:var(--text);background:var(--surface)}
.proto-note{font-size:12px;color:var(--muted)}
.proto-note b{color:var(--text);font-weight:600}
.reset{white-space:nowrap;flex:none;border:1px solid var(--border);background:var(--raised);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}

/* ---------- Browser frame ---------- */
.browser{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.browser-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--border)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--border-strong);opacity:.6}
.url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.navbtn:hover{background:var(--bg)}
.page{min-height:640px}

/* ---------- Phone frame ---------- */
.phone-stage{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding-block:8px}
.phone{width:390px;max-width:100%;height:800px;background:var(--bg);border:10px solid var(--inverse);border-radius:46px;overflow:hidden;position:relative;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.phone-notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:var(--inverse);border-radius:20px;z-index:5}
.phone-screen{flex:1;overflow-y:auto;padding-top:44px;position:relative}
.phone-tabs{display:flex;border-top:1px solid var(--border);background:var(--bg);padding-bottom:14px}
.phone-tabs button{flex:1;border:0;background:transparent;padding:8px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--subtle);position:relative;min-height:52px}
.phone-tabs button[aria-current="page"]{color:var(--accent)}
.side-notes{max-width:340px;display:flex;flex-direction:column;gap:12px}
.note-card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px}
.note-card h3{font-size:15px}
.note-card ol,.note-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}

/* ---------- Shared components ---------- */
.container{width:100%;max-width:1240px;margin:0 auto;padding-inline:clamp(14px,3vw,32px)}
.section{padding-block:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;background:transparent;font-weight:600;font-size:14px;color:var(--text);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)} .btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{border-color:var(--border-strong)} .btn-secondary:hover{border-color:var(--text)}
.btn-inverse{background:var(--inverse);color:var(--text-inverse)}
.btn-ghost:hover{background:var(--surface)}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px}
.btn-lg{min-height:52px;padding:0 26px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;color:var(--text);position:relative}
.icon-btn:hover{background:var(--surface)}
.count{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:grid;place-items:center}
.link{color:var(--link);text-decoration:underline;text-underline-offset:.2em;text-decoration-color:transparent;background:none;border:0;padding:0;font-weight:500}
.link:hover{text-decoration-color:currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--text);width:fit-content;white-space:nowrap}
.badge-sale{background:var(--sale-fill);color:var(--on-fill)}
.badge-promo{background:var(--promo-fill);color:var(--on-fill)}
.badge-accent{background:var(--accent-subtle);color:var(--link)}
.badge-outline{background:transparent;border:1px solid var(--border)}
.card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.between{justify-content:space-between}
.grid-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,23%);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.shelf>*{scroll-snap-align:start}
.art{aspect-ratio:1;border-radius:var(--r-md);background:var(--surface);display:grid;place-items:center}
.art span{width:52%;aspect-ratio:1;border-radius:50%;background:var(--accent-subtle);color:var(--link);display:grid;place-items:center}
.art.wide{aspect-ratio:16/9}
.pcard{position:relative;cursor:pointer;transition:box-shadow .25s,transform .25s;text-align:left}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard .title{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.price{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-variant-numeric:tabular-nums}
.price b{font-weight:600}
.strike{text-decoration:line-through;color:var(--subtle);font-size:12.5px}
.rating{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.rating svg{fill:var(--rating);stroke:var(--rating)}
.seller{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.seller svg{color:var(--link)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg);font-size:15px;width:100%}
.field [aria-invalid="true"]{border-color:var(--danger)}
.err{font-size:12px;color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--inverse);color:var(--text-inverse)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface)}
tbody tr:hover{background:var(--surface)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--subtle)}
.st-good::before{background:var(--success)} .st-warn::before{background:var(--warning)} .st-info::before{background:var(--accent)} .st-bad::before{background:var(--danger)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--inverse);color:var(--text-inverse);padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:100;max-width:calc(100vw - 32px)}
.empty{border:1px dashed var(--border-strong);border-radius:var(--r-lg);padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.timeline li.done{color:var(--text);font-weight:500}
.timeline .dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;flex:none}
.timeline li.done .dot{background:var(--success);border-color:transparent;color:var(--on-fill)}
.timeline li.now .dot{border:2px solid var(--accent)}
.otp{font-family:var(--mono);font-size:26px;letter-spacing:.2em;font-weight:500}
.split{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)} .split.side{grid-template-columns:240px minmax(0,1fr)} .split.sum{grid-template-columns:minmax(0,1fr) 330px}}
.modal-back{position:fixed;inset:0;background:rgb(10 11 13 / .55);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:var(--bg);border-radius:var(--r-lg);max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
.notice{background:var(--accent-subtle);color:var(--text);font-size:12px;text-align:center;padding:4px 12px}

/* ---------- Market header ---------- */
.m-util{background:var(--surface);font-size:12px;color:var(--muted)}
.m-util .container{display:flex;justify-content:space-between;gap:12px;padding-block:5px}
.m-head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.m-main{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo search acct";gap:10px 16px;align-items:center;padding-block:10px}
.m-logo{grid-area:logo;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:700;font-size:17px}
.m-logo small{font-weight:500;font-size:13px;color:var(--muted);padding-left:8px;border-left:1px solid var(--border-strong)}
.m-search{grid-area:search;display:flex;height:44px;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--bg)}
.m-search input{flex:1;min-width:0;border:0;padding:0 16px;background:transparent;font-size:15px;outline:none}
.m-search button{width:54px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.m-acct{grid-area:acct;display:flex;gap:2px}
.m-cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 8px}
.m-cats button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.m-cats button:hover{background:var(--surface);color:var(--text)}
.m-cats .deal{color:var(--promo);font-weight:500}
@media (max-width:760px){.m-main{grid-template-columns:auto 1fr;grid-template-areas:"logo acct" "search search"}}
.hero{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.hero{grid-template-columns:2fr 1fr}}
.hero-main{background:var(--inverse);color:var(--text-inverse);border-radius:var(--r-xl);padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero-main .eyebrow{color:var(--text-inverse);opacity:.75}
.hero-main h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.022em;max-width:16ch}
.hero-main .btn-secondary{border-color:var(--text-inverse);color:var(--text-inverse)}
.promo{background:var(--surface);border-radius:var(--r-xl);padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;text-align:left;width:100%}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-block:14px;border-block:1px solid var(--border)}
.trust div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.trust svg{color:var(--link);flex:none}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cat-tiles button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:var(--r-md);font-size:13px;font-weight:500}
.cat-tiles button:hover{background:var(--surface)}
.cat-tiles .ic{width:56px;height:56px;border-radius:50%;background:var(--accent-subtle);color:var(--link);display:grid;place-items:center}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:14px}
.sec-head h2{font-size:clamp(22px,2.4vw,28px)}
.countdown{font-family:var(--mono);background:var(--promo-fill);color:var(--on-fill);padding:2px 8px;border-radius:4px;font-size:13px}
.filters{display:flex;flex-direction:column;gap:16px}
.filters fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.filters legend{font-weight:600;font-size:13.5px;margin-bottom:6px}
.qty{width:fit-content;display:inline-flex;align-items:center;height:40px;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden}
.qty button{width:40px;height:100%;border:0;background:transparent;font-size:18px}
.qty button:hover{background:var(--surface)}
.qty span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.summary dl{margin:0;display:flex;flex-direction:column;gap:8px}
.summary dl div{display:flex;justify-content:space-between;font-size:14px}
.summary dd{margin:0;font-variant-numeric:tabular-nums}
.summary .total{border-top:1px solid var(--border);padding-top:10px;font-weight:600;font-size:16px}
.steps{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border-strong);font-size:12px}
.steps .on{color:var(--text);font-weight:500}.steps .on b{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.provider{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer}
.provider:has(input:checked){border-color:var(--accent);background:var(--accent-subtle)}
.footer{background:var(--surface);border-top:1px solid var(--border);padding-block:24px;font-size:13px;color:var(--muted)}

/* ---------- Staff & seller shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:680px}
@media (min-width:960px){.shell{grid-template-columns:220px minmax(0,1fr)}}
.side{border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
@media (max-width:959px){.side{border-right:0;border-bottom:1px solid var(--border);flex-direction:row;overflow-x:auto;padding:8px}.side .grp-t{display:none}.side .grp{flex-direction:row}}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-t{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-top:4px}
.side button{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:left}
.side button:hover{background:var(--surface);color:var(--text)}
.side button[aria-current="page"]{background:var(--accent-subtle);color:var(--link);font-weight:600}
.main{padding:20px clamp(14px,2.4vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.panel{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-h h3{font-size:15px}
.mini-search{height:34px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 10px;background:var(--bg);font-size:13.5px;min-width:0}

/* ---------- Mobile app ---------- */
.app-head{position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.app-search{display:flex;align-items:center;gap:8px;height:42px;border-radius:999px;background:var(--surface);padding:0 14px;color:var(--muted);font-size:14px;border:0;width:100%;text-align:left}
.app-body{padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app-shelf{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:10px;overflow-x:auto;scrollbar-width:none}
.sticky-buy{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rider-big{min-height:56px;font-size:16px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--raised);font-size:22px;font-weight:500}
.otp-cells{display:flex;gap:8px;justify-content:center}
.otp-cells span{width:42px;height:52px;border:1px solid var(--border-strong);border-radius:var(--r-sm);display:grid;place-items:center;font-family:var(--mono);font-size:22px}
.shift{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:var(--r-lg);background:var(--surface)}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:var(--border-strong);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--bg);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--success)} .switch[aria-checked="true"]::after{transform:translateX(24px)}
.offline-bar{background:var(--warning);color:var(--on-fill);font-size:12.5px;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}

else if(m==="vendors")main=`<h1 style="font-size:28px">Vendors</h1><div class="panel"><div class="panel-h"><h3>KYC review queue</h3></div>${st.seller.status==="pending_kyc"?`<div class="row between" style="padding:16px"><div><b>${esc(st.seller.shop)}</b><br><span class="xs muted">Individual · NIN ending ${esc(st.seller.nin4)} · bank account ending ${esc(st.seller.acct4)}</span></div><div class="row"><button class="btn btn-ghost btn-sm" type="button" data-act="kyc-reject">Request more info</button><button class="btn btn-primary btn-sm" type="button" data-act="kyc-approve">Approve</button></div></div>`:`<div class="empty" style="margin:16px"><b>No applications waiting</b><span class="sm muted">Register a shop in the <button class="link" type="button" data-act="switch" data-app="seller">Seller Centre</button> to see one here.</span></div>`}</div>${tableHTML(["Seller","Type","Rating","Status"],[["Ikeja Gadget Hub","Business","4.6","Active"],["Wuse Tech Store","Business","4.4","Active"],...(st.seller.status==="active"?[[st.seller.shop,"Individual","—","Active"]]:[])],"Sellers")}`;
else if(m==="b2b")main=`<h1 style="font-size:28px">B2B accounts</h1>${tableHTML(["Quote","Business","Items","Status"],[...st.quotes.map(q=>[q.ref,q.co,q.items+" items","Requested"]),["QT-1001","Brightline Schools Ltd","40 items","Sent"]],"Quotes")}`;
else if(m==="finance"){const rows=st.journals.flatMap(j=>j.entries.map((e,i)=>[i===0?j.ref:"",e[0],e[1]>0?naira(e[1]):"",e[1]<0?naira(-e[1]):""]));main=`<h1 style="font-size:28px">Finance</h1><p class="sm muted">Every paid order posts a balanced double-entry journal (debits = credits).</p>${rows.length?tableHTML(["Journal","Account","Debit","Credit"],rows,"Ledger journals"):`<div class="empty"><b>No journals yet</b><span class="sm muted">Check out on the Market to post one.</span></div>`}`}
else if(m==="catalogue")main=`<h1 style="font-size:28px">Catalogue</h1>${tableHTML(["Product","Category","Seller","Price","Status"],st.products.filter(p=>!st.staffQ||p.name.toLowerCase().includes(st.staffQ.toLowerCase())).slice(0,30).map(p=>[p.name,CATS.find(c=>c.slug===p.cat).name,seller(p).name,naira(p.price),"Live"]),"Products",true)}`;
else {const g=GENERIC[m]||[["Name","Status"],[]];main=`<h1 style="font-size:28px">${cur[1]}</h1><span class="sm muted">Sample data</span>${g[1].length?tableHTML(g[0],g[1],cur[1]):`<div class="empty"><b>No ${cur[1].toLowerCase()} data yet</b><span class="sm muted">This module shows live data once connected to the API.</span></div>`}`}
const head=`<header class="m-head" style="position:static"><div class="row between" style="padding:10px 16px"><span class="m-logo">${logo("Staff")}</span><div class="row"><input class="mini-search" placeholder="Search orders, products…" value="${esc(st.staffQ)}" data-act="staffq" aria-label="Search"><span class="icon-btn">${ic("bell",18)}</span><span class="badge badge-outline">Operations Manager · sample role</span></div></div></header>`;

function ordersTable(list,title,full){return `<div class="panel"><div class="panel-h"><h3>${title}</h3>${full?"":`<button class="link sm" type="button" data-go="orders">All orders ›</button>`}</div><div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Channel</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.n}</b><br><span class="xs muted">${o.placed}</span></td><td>${esc(o.customer)}</td><td class="muted">${o.channel}</td><td class="num">${naira(o.lines.reduce((t,l)=>t+l[1]*l[2],0))}</td><td><span class="status ${statusTone[o.status]}">${statusText[o.status]}</span></td></tr>`).join("")}</tbody></table></div></div>`}
function tableHTML(cols,rows,title,search){return `<div class="panel"><div class="panel-h"><h3>${title}</h3>${search?`<span class="xs muted">${rows.length} rows</span>`:""}</div><div class="tbl-wrap"><table><thead><tr>${cols.map((c,i)=>`<th class="${rows.some(r=>/^₦|^\d|^▲/.test(r[i]||""))?"num":""}">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/^₦|^\d|^▲/.test(c)?"num":""}">${i===r.length-1&&cols[cols.length-1]==="Status"?`<span class="status ${tone(c)}">${esc(c)}</span>`:esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}

/* ================= CUSTOMER APP (mobile) ================= */
function appEmpty(icn,t,s){return `<div class="app-body"><div class="empty">${ic(icn,28)}<b>${t}</b><span class="sm muted">${s}</span></div></div>`}

switch(r[0]){

case"categories":screen=head("Categories")+`<div class="app-body">${CATS.map(c=>`<button class="card pcard" style="flex-direction:row;align-items:center" type="button" data-go="cat" data-arg="${c.slug}"><span class="ic" style="width:44px;height:44px;border-radius:50%;background:var(--accent-subtle);color:var(--link);display:grid;place-items:center">${ic(c.icon,20)}</span><span style="flex:1"><b>${c.name}</b><br><span class="xs muted">${c.subs.join(" · ")}</span></span>${ic("chev",16)}</button>`).join("")}</div>`;tab="categories";break;
case"cat":{const c=CATS.find(x=>x.slug===r[1]);screen=head(c.name,true)+(c.slug==="cars"?`<div class="app-body">${CARS.map(x=>`<div class="card">${art("cars",true)}<b>${x.title}</b><span class="xs muted">${x.km.toLocaleString("en-NG")} km · ${x.loc}</span><b>${naira(x.price)}</b><span class="xs muted">Book a viewing on the car page</span></div>`).join("")}</div>`:`<div class="app-body"><div class="app-grid">${st.products.filter(p=>p.cat===r[1]).map(p=>pcard(p,"app-product")).join("")}</div></div>`);tab="categories";break}
case"search":{const q=(st.appQ||"").toLowerCase();const res=st.products.filter(p=>q&&`${p.name} ${p.brand} ${p.spec}`.toLowerCase().includes(q));screen=`<div class="app-head"><form class="row" data-form="appsearch" style="flex-wrap:nowrap"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${ic("back",20)}</button><input class="app-search" style="cursor:text" name="aq" aria-label="Search" placeholder="Search…" value="${esc(st.appQ||"")}" autofocus></form></div><div class="app-body">${q?(res.length?`<div class="app-grid">${res.map(p=>pcard(p,"app-product")).join("")}</div>`:`<div class="empty"><b>No results</b><span class="sm muted">Try “Nova” or “laptop”.</span></div>`):`<span class="sm muted">Popular: Nova · Orbit · gaming laptop · power bank</span>`}</div>`;break}
case"product":{const p=prod(r[1]);screen=head("",true)+`<div class="app-body" style="padding-bottom:90px">${art(p.cat)}<p class="eyebrow">${esc(p.brand)}</p><h2 style="font-size:22px">${esc(p.name)}</h2><span class="muted sm">${esc(p.spec)}</span>${priceHTML(p,true)}<span class="seller">${seller(p).type==="techshop"?ic("verified",13)+"Sold by TechShop":"Sold by "+esc(seller(p).name)}</span><span class="sm muted">${ic("truck",14)} Delivery to Lagos tomorrow</span></div><div class="sticky-buy"><b class="tnum">${naira(p.price)}</b><button class="btn btn-primary" type="button" data-act="add" data-id="${p.id}">Add to cart</button></div>`;break}
case"saved":screen=head("Saved")+(st.saved.size?`<div class="app-body"><div class="app-grid">${[...st.saved].map(id=>pcard(prod(id),"app-product")).join("")}</div></div>`:appEmpty("heart","Nothing saved yet","Tap the heart on a product."));break;
case"cart":{const t=cartTotals();screen=head("Cart")+(t.lines.length?`<div class="app-body">${t.lines.map(l=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="width:64px;flex:none">${art(l.p.cat)}</div><div class="stack" style="gap:4px;flex:1;min-width:0"><b class="sm">${esc(l.p.name)}</b><span class="xs muted">${naira(l.p.price)} each</span><div class="qty" style="height:36px"><button type="button" data-act="cq" data-id="${l.p.id}" data-d="-1" aria-label="Decrease">−</button><span>${l.q}</span><button type="button" data-act="cq" data-id="${l.p.id}" data-d="1" aria-label="Increase">+</button></div></div></div>`).join("")}<div class="summary"><dl><div><dt>Items</dt><dd>${naira(t.sub)}</dd></div><div><dt>Delivery</dt><dd>${naira(t.del)}</dd></div><div class="total"><dt>Total</dt><dd>${naira(t.total)}</dd></div></dl></div><button class="btn btn-primary btn-lg btn-block" type="button" data-go="checkout">Checkout</button><span class="xs muted">Same cart as the website: you’re signed in on both.</span></div>`:appEmpty("cart","Your cart is empty","Browse deals to get started."));break}
case"checkout":screen=head("Checkout",true)+checkoutView(true);tab="cart";break;
case"orders":screen=head("Orders",true)+`<div class="app-body">${st.orders.map(o=>`<button class="card pcard" type="button" data-act="app-order" data-id="${o.n}"><div class="row between"><b>${o.n}</b><span class="status ${statusTone[o.status]}">${statusText[o.status]}</span></div><span class="xs muted">${o.lines.map(l=>esc(prod(l[0])?.name)).join(", ")}</span></button>`).join("")}</div>`;tab="account";break;
case"order":screen=head("Order",true)+orderView(r[1],true);tab="account";break;
case"account":screen=head("Account")+`<div class="app-body"><div class="card"><b>${st.user?esc(st.user.name):"Guest"}</b><span class="xs muted">${st.user?esc(st.user.phone):"Sign in on the website’s Account page (demo code 123456)."}</span></div>${[["truck","Orders","orders"],["returns","Returns"],["shield","Warranty"],["swap","Trade-in"],["pin","Addresses"],["lock","Privacy & data"]].map(x=>`<button class="card pcard" style="flex-direction:row;align-items:center" type="button" ${x[2]?`data-go="${x[2]}"`:""}><span style="color:var(--link)">${ic(x[0],20)}</span><span style="flex:1">${x[1]}</span>${ic("chev",16)}</button>`).join("")}</div>`;break;
default:screen=head("TechShop")}
const tabs=[["home","Home","home"],["categories","Categories","grid"],["saved","Saved","heart"],["cart","Cart","cart"],["account","Account","user"]];
const t2={product:"home",search:"home",cat:"categories"}[r[0]]||tab;
return `<div class="phone-stage"><div class="phone" aria-label="Customer app"><span class="phone-notch"></span><div class="phone-screen">${screen}</div><nav class="phone-tabs" aria-label="App tabs">${tabs.map(t=>`<button type="button" data-go="${t[0]}" ${t2===t[0]?'aria-current="page"':""}>${ic(t[2],22)}${t[1]}${t[0]==="cart"&&cartCount()?`<span class="count" style="top:2px;right:24%">${cartCount()}</span>`:""}</button>`).join("")}</nav></div>
<div class="side-notes"><div class="note-card"><h3>Customer app (Expo)</h3><ol><li>Browse and add to cart: the cart is shared with the website.</li><li>Check out with Paystack, OPay or Moniepoint.</li><li>Track the order, then deliver it in the Logistics app with the code shown.</li></ol></div><div class="note-card"><h3>Designed for</h3><ul><li>Mid-range Android, slow networks</li><li>44px touch targets, thumb-zone actions</li><li>Light and dark from the shared tokens</li></ul></div></div></div>`}

/* ================= LOGISTICS APP (mobile) ================= */
function logiView(){const r=route(),L=st.logi;let screen="";
const myJobs=st.orders.filter(o=>o.rider==="Emeka N."&&o.status!=="delivered");const done=st.orders.filter(o=>o.rider==="Emeka N."&&o.status==="delivered");
const offline=!L.online?`<div class="offline-bar">${ic("wifi",14)} Offline · ${L.queue.length} action${L.queue.length===1?"":"s"} waiting to sync<button class="btn btn-sm" style="color:var(--on-fill);border-color:var(--on-fill);min-height:28px" type="button" data-act="online">Go online</button></div>`:L.queue.length?`<div class="offline-bar" style="background:var(--accent)">Syncing…</div>`:"";
const head=(t,back)=>`<div class="app-head"><div class="row between">${back?`<div class="row"><button class="icon-btn" type="button" data-act="back" aria-label="Back">${ic("back",20)}</button><b>${t}</b></div>`:`<b style="font-size:20px">${t}</b>`}<div class="row" style="gap:4px"><button class="btn btn-ghost btn-sm" type="button" data-act="role">${L.role==="rider"?"Rider":"Dispatcher"} ⇄</button></div></div></div>${offline}`;
if(L.role==="dispatcher"){const ready=st.orders.filter(o=>o.status==="packed"||o.status==="paid");screen=head("Dispatch")+`<div class="app-body"><div class="kpis" style="grid-template-columns:1fr 1fr">${[["Awaiting",ready.length],["Riders free",st.riders.filter(x=>x.status==="available").length]].map(k=>`<div class="card kpi"><span class="sm muted">${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>${ready.length?ready.map(o=>`<div class="card"><div class="row between"><b>${o.n}</b><span class="status ${statusTone[o.status]}">${statusText[o.status]}</span></div><span class="xs muted">${esc(o.state)} · ${o.lines.length} item(s)</span>${o.status==="paid"?`<button class="btn btn-secondary rider-big" type="button" data-act="pack" data-id="${o.n}">Mark packed</button>`:`<button class="btn btn-primary rider-big" type="button" data-act="assign-btn" data-id="${o.n}">Assign Emeka N.</button>`}</div>`).join(""):`<div class="empty"><b>No jobs waiting</b><span class="sm muted">Place an order on the Market to create one.</span></div>`}</div>`}
else if(r[0]==="today")screen=head("Today")+`<div class="app-body"><div class="shift"><div><b>${L.shift?"On shift":"Off shift"}</b><br><span class="xs muted">${L.shift?"Sharing location while on shift":"Start your shift to receive jobs"}</span></div><button class="switch" role="switch" aria-checked="${L.shift}" aria-label="Shift" type="button" data-act="shift"></button></div>
<label class="check"><input type="checkbox" data-act="offline" ${!L.online?"checked":""}>Simulate no network (offline queue)</label>
<b>To deliver</b>${myJobs.length?myJobs.map(o=>`<button class="card pcard" type="button" data-act="job" data-id="${o.n}"><div class="row between"><b>${o.n}</b><span class="status ${statusTone[o.status]}">${o.status==="out_for_delivery"&&L.scanned[o.n]?"Picked up":statusText[o.status]}</span></div><span class="sm">${esc(o.customer)} · ${esc(o.addr||"14 Admiralty Way, Lekki")}</span><span class="xs muted">Window 12:00–15:00</span></button>`).join(""):`<div class="empty"><b>No jobs yet</b><span class="sm muted">${L.shift?"Dispatch assigns jobs from the Staff portal or the Dispatcher view.":"Start your shift first."}</span></div>`}
${done.length?`<b>Done</b>${done.map(o=>`<div class="card"><div class="row between"><b>${o.n}</b><span class="status">Delivered</span></div></div>`).join("")}`:""}</div>`;
else if(r[0]==="job"){const o=st.orders.find(x=>x.n===r[1]);const picked=L.scanned[o.n];screen=head(o.n,true)+`<div class="app-body"><div class="card"><b>${esc(o.customer.split(" ")[0])}</b><span class="sm">${esc(o.addr||"14 Admiralty Way, Lekki")}</span><span class="xs muted">Landmark: opposite the filling station · window 12:00–15:00</span><div class="row"><button class="btn btn-secondary btn-sm" type="button" data-act="toast" data-msg="Opens Google Maps navigation">${ic("map",14)}Navigate</button><button class="btn btn-secondary btn-sm" type="button" data-act="toast" data-msg="Calls the customer (number masked)">Call</button></div></div>
${o.status==="delivered"?`<div class="card"><b style="color:var(--success)">Delivered</b></div>`:!picked?`<button class="btn btn-primary btn-block rider-big" type="button" data-act="scan" data-id="${o.n}">${ic("scan",20)}Scan parcel to pick up</button>`:`<button class="btn btn-primary btn-block rider-big" type="button" data-go="deliver" data-arg="${o.n}">Deliver with code</button><button class="btn btn-secondary btn-block rider-big" type="button" data-go="fail" data-arg="${o.n}">Couldn’t deliver</button>`}</div>`}
else if(r[0]==="deliver"){const o=st.orders.find(x=>x.n===r[1]);const e=L.otpEntry;screen=head("Delivery code",true)+`<div class="app-body"><p class="sm muted">Ask ${esc(o.customer.split(" ")[0])} for the 6-digit code from their SMS or the TechShop app. ${L.online?"":"<b>Offline: the code can’t be checked — use photo proof.</b>"}</p><div class="otp-cells">${[0,1,2,3,4,5].map(i=>`<span>${e[i]||""}</span>`).join("")}</div>${L.otpErr?`<p class="err" style="text-align:center">${L.otpErr}</p>`:""}<div class="keypad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"].map(k=>`<button type="button" data-act="key" data-k="${k}" aria-label="${k==="⌫"?"Delete":k==="✓"?"Confirm":k}">${k}</button>`).join("")}</div><button class="btn btn-secondary btn-block rider-big" type="button" data-act="photo" data-id="${o.n}">Use photo proof instead</button><p class="xs muted">Hint: the code is on the order page in the Market or customer app.</p></div>`}
else if(r[0]==="fail")screen=head("Couldn’t deliver",true)+`<div class="app-body">${["Customer unreachable","Customer refused","Wrong address","Customer rescheduled","Unsafe or no access"].map(x=>`<button class="btn btn-secondary btn-block rider-big" type="button" data-act="failr" data-id="${r[1]}" data-msg="${x}">${x}</button>`).join("")}</div>`;
return `<div class="phone-stage"><div class="phone" aria-label="Logistics app"><span class="phone-notch"></span><div class="phone-screen">${screen}</div></div>
<div class="side-notes"><div class="note-card"><h3>Logistics app (riders + dispatch)</h3><ol><li>Place an order on the Market.</li><li>Switch to <b>Dispatcher</b>: mark it packed and assign Emeka.</li><li>Back as <b>Rider</b>: start shift, open the job, scan, enter the customer’s code.</li><li>Tick “Simulate no network” to see actions queue and sync.</li></ol></div><div class="note-card"><h3>Built for the road</h3><ul><li>52px keys and buttons (gloves, sunlight)</li><li>Offline queue with one ID per action, so retries never duplicate</li><li>Location only shared on shift</li></ul></div></div></div>`}

 $("#stage").innerHTML=v; renderOverlay();
}
function renderOverlay(){let h="";if(st.modal==="pay"){const t=cartTotals();const prov={paystack:"Paystack",opay:"OPay",moniepoint:"Moniepoint (Monnify)"}[st.checkout.provider];h+=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><span class="eyebrow">Secure checkout · test mode</span><h2 id="mt" style="font-size:22px">${prov}</h2><p class="sm muted">In the real app this opens the provider in a secure browser. Pay ${naira(t.total)} to TechShop.</p><div class="row"><button class="btn btn-secondary" type="button" data-act="pay-decline">Decline</button><button class="btn btn-primary" style="flex:1" type="button" data-act="pay-approve">Approve payment</button></div></div></div>`}
 if(st.modal==="verifying")h+=`<div class="modal-back"><div class="modal" role="status"><b>Confirming payment…</b><p class="sm muted">The server verifies the provider’s webhook before marking the order paid.</p></div></div>`;
 if(st.toast)h+=`<div class="toast" role="status">${esc(st.toast)}</div>`;$("#overlay").innerHTML=h}

/* ================= Actions ================= */
function placeOrder(){const t=cartTotals();const n="TS-"+st.nextOrder++;const prov={paystack:"Paystack",opay:"OPay",moniepoint:"Moniepoint"}[st.checkout.provider];
 const o={n,customer:st.checkout.addr.name,channel:st.app==="app"?"App":"Market",lines:t.lines.map(l=>[l.p.id,l.q,l.p.price]),status:"paid",otp:String(Math.floor(100000+Math.random()*900000)),rider:null,placed:"Just now",provider:prov,state:st.checkout.addr.state,addr:st.checkout.addr.line1+", "+st.checkout.addr.city};
 st.orders.unshift(o);
 // balanced journal: debit clearing, credit revenue/seller payable/delivery
 const entries=[["clearing:"+st.checkout.provider,t.total]];Object.entries(t.groups).forEach(([sid,ls])=>{const v=ls.reduce((a,l)=>a+l.p.price*l.q,0);entries.push([S[sid]?.type==="techshop"?"revenue:first_party_sales":"seller_payable:"+sid,-v])});entries.push(["revenue:delivery",-t.del]);
 st.journals.unshift({ref:"sale · "+n,entries});st.cart={};st.checkout.step=3;}
const handlers={
 switch:d=>{st.app=d.app;render();window.scrollTo({top:0})},
 reset:()=>{st=fresh();render();toast("Demo reset")},
 back:()=>{const r=route();const map={product:["home"],cat:["home"],deals:["home"],search:["home"],cart:["home"],checkout:["cart"],order:["orders"],orders:["home"],car:["cars"],cars:["home"],account:["home"],saved:["home"],help:["home"],wproduct:["home"],quote:["home"],register:["landing"],job:["today"],deliver:["job",r[1]],fail:["job",r[1]]};go(...(map[r[0]]||["home"]))},
 "market-product":d=>{st.pq=1;go("product",d.id)},
 "app-product":d=>go("product",d.id),
 "market-order":d=>{st.app="market";st.routes.market=["order",d.id];render()},
 "app-order":d=>go("order",d.id),
 pq:d=>{st.pq=Math.max(1,Math.min(10,(st.pq||1)+ +d.d));$("#pq").textContent=st.pq},
 add:d=>{st.cart[d.id]=(st.cart[d.id]||0)+(st.app==="market"?(st.pq||1):1);toast(`Added to cart · ${prod(d.id).name}`);render()},
 save:d=>{st.saved.has(d.id)?st.saved.delete(d.id):st.saved.add(d.id);toast(st.saved.has(d.id)?"Saved":"Removed from saved");render()},
 cq:d=>{const q=(st.cart[d.id]||0)+ +d.d;if(q<=0)delete st.cart[d.id];else st.cart[d.id]=Math.min(10,q);render()},
 rm:d=>{delete st.cart[d.id];toast(`Removed ${prod(d.id).name}`);render()},
 "clear-filters":()=>{st.filters.cond=[];st.filters.seller=[];render()},
 "co-step":d=>{st.checkout.step=+d.s;render()},
 prov:(d,el)=>{st.checkout.provider=el.value},
 pay:()=>{st.modal="pay";renderOverlay()},
 "pay-decline":()=>{st.modal=null;renderOverlay();toast("Payment declined — your cart is kept. Try another provider.")},
 "pay-approve":()=>{st.modal="verifying";renderOverlay();setTimeout(()=>{st.modal=null;placeOrder();render();toast("Payment verified · order confirmed")},1400)},
 signout:()=>{st.user=null;st.auth=null;render()},
 "viewing-reset":()=>{st.viewing={...st.viewing,done:false};render()},
 wq:d=>{st.wq??={};const min=TIERS[d.id][0][0];st.wq[d.id]=Math.max(1,(st.wq[d.id]||min)+ +d.d);render()},
 "add-quote":d=>{st.quote[d.id]=st.wq?.[d.id]||TIERS[d.id][0][0];toast("Added to your quote");render()},
 "kyc-approve":()=>{st.seller.status="active";toast(`${st.seller.shop} approved — seller can now list`);render()},
 "kyc-reject":()=>toast("We’d email the seller asking for a clearer ID photo"),
 pack:d=>{const o=st.orders.find(x=>x.n===d.id);o.status="packed";toast(`${o.n} packed`);render()},
 "assign-btn":d=>assign(d.id,"Emeka N."),
 shift:()=>{st.logi.shift=!st.logi.shift;render()},
 role:()=>{st.logi.role=st.logi.role==="rider"?"dispatcher":"rider";st.routes.logi=["today"];render()},
 online:()=>{st.logi.online=true;syncQueue()},
 job:d=>go("job",d.id),
 scan:d=>{queue({kind:"picked_up",job:d.id});st.logi.scanned[d.id]=true;toast("Parcel matched "+d.id);render()},
 key:d=>{const L=st.logi;L.otpErr="";if(d.k==="⌫")L.otpEntry=L.otpEntry.slice(0,-1);else if(d.k==="✓")checkOtp();else if(L.otpEntry.length<6)L.otpEntry+=d.k;if(L.otpEntry.length===6&&d.k!=="✓")checkOtp();render()},
 photo:d=>{deliverOrder(d.id,"photo")},
 failr:d=>{queue({kind:"attempt_failed",job:d.id,reason:d.msg});toast("Recorded: "+d.msg+" · dispatch notified");go("today")},
 toast:d=>toast(d.msg)
};
function assign(n,rider){const o=st.orders.find(x=>x.n===n);if(!rider)return;o.status="out_for_delivery";o.rider=rider;st.logi.shift=true;toast(`${rider} assigned · delivery code texted to customer`);render()}
function queue(ev){ev.id=crypto.randomUUID?crypto.randomUUID():String(Math.random());if(st.logi.online){/* sent immediately */}else st.logi.queue.push(ev)}
function syncQueue(){const q=st.logi.queue;render();setTimeout(()=>{const n=q.length;st.logi.queue=[];render();if(n)toast(`Synced ${n} queued action${n>1?"s":""} — each sent once`)},900)}
function checkOtp(){const L=st.logi;const n=route()[1];const o=st.orders.find(x=>x.n===n);if(!L.online){L.otpErr="Offline — can’t verify. Use photo proof.";return}if(L.otpEntry===o.otp){deliverOrder(n,"otp")}else{L.otpErr="That code doesn’t match. Ask the customer to check their SMS.";L.otpEntry=""}}
function deliverOrder(n,how){const o=st.orders.find(x=>x.n===n);queue({kind:"delivered",job:n,proof:how});if(st.logi.online||how==="photo"){o.status="delivered";}st.logi.otpEntry="";const r=st.riders.find(x=>x.name===o.rider);toast(how==="otp"?"Code verified · delivered":"Photo proof recorded · delivered"+(st.logi.online?"":" (will sync)"));st.routes.logi=["today"];render()}

/* ================= Event wiring ================= */
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go,...(g.dataset.arg?[g.dataset.arg]:[]));return}
 const a=e.target.closest("[data-act]");if(!a||a.tagName==="SELECT"||(a.tagName==="INPUT"&&a.type!=="radio"))return;if(a.type==="radio"){handlers.prov(a.dataset,a);return}const h=handlers[a.dataset.act];if(h){e.preventDefault();h(a.dataset,a)}});
document.addEventListener("change",e=>{const el=e.target;
 if(el.dataset.filter){const arr=st.filters[el.dataset.filter];el.checked?arr.push(el.value):arr.splice(arr.indexOf(el.value),1);render();return}
 if(el.dataset.act==="sort"){st.filters.sort=el.value;render();return}
 if(el.dataset.act==="assign"){assign(el.dataset.id,el.value);return}
 if(el.dataset.act==="offline"){st.logi.online=!el.checked;if(st.logi.online)syncQueue();else{render();toast("Offline: actions will queue on the device")}return}
 if(el.dataset.act==="prov"){st.checkout.provider=el.value}});
document.addEventListener("input",e=>{if(e.target.dataset.act==="staffq"){st.staffQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('[data-act="staffq"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f));const k=f.dataset.form;
 if(k==="search"){st.filters={cond:[],seller:[],sort:"relevance"};go("search",v.q.trim())}
 if(k==="appsearch"){st.appQ=v.aq;render()}
 if(k==="addr"){const er={};if(!v["ad-name"].trim())er.name="Enter the recipient’s name.";const ph=normPhone(v["ad-phone"]);if(!ph)er.phone="Enter a Nigerian mobile number, for example 0803 123 4567.";if(!v["ad-line1"].trim())er.line1="Enter the street address.";if(!v["ad-city"].trim())er.city="Enter the city or LGA.";
  st.checkout.addr={name:v["ad-name"],phone:v["ad-phone"],line1:v["ad-line1"],city:v["ad-city"],state:v["ad-state"]};st.checkout.errors=er;if(!Object.keys(er).length)st.checkout.step=2;render();if(Object.keys(er).length)document.querySelector('[aria-invalid="true"]')?.focus()}
 if(k==="otp1"){const ph=normPhone(v["au-phone"]);st.auth={step:ph?2:1,phone:v["au-phone"],norm:ph,err:ph?"":"Enter a Nigerian mobile number, for example 0803 123 4567."};render()}
 if(k==="otp2"){if(v["au-code"].trim()==="123456"){st.user={name:"Adaeze",phone:st.auth.norm};toast("Signed in");go("home")}else{st.auth.err="That code is wrong. The demo code is 123456.";render()}}
 if(k==="viewing"){const er={};if(!v["v-name"].trim())er.name="Enter your name.";if(!normPhone(v["v-phone"]))er.phone="Enter a Nigerian mobile number, for example 0803 123 4567.";st.viewing={name:v["v-name"],phone:normPhone(v["v-phone"])||v["v-phone"],slot:v["v-slot"],errors:er,done:!Object.keys(er).length};render()}
 if(k==="quote"){const er={};if(!v["q-co"].trim())er.co="Enter your business name.";if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v["q-email"]))er.email="Enter an email like name@company.com.";st.qform={co:v["q-co"],email:v["q-email"],state:v["q-state"],notes:v["q-notes"],errors:er};if(!Object.keys(er).length){const ref="QT-"+(1002+st.quotes.length);st.qform.done=true;st.qform.ref=ref;st.quotes.unshift({ref,co:v["q-co"],items:Object.values(st.quote).reduce((a,b)=>a+b,0)||1})}render()}
 if(k==="seller"){const er={};if(!v["s-name"].trim())er.name="Enter your name as on your ID.";if(!normPhone(v["s-phone"]))er.phone="Enter a Nigerian mobile number.";if(!v["s-shop"].trim())er.shop="Enter a shop name.";if(!/^\d{11}$/.test(v["s-nin"].trim()))er.nin="NIN must be 11 digits.";if(!/^\d{10}$/.test(v["s-acct"].trim()))er.acct="Account number must be 10 digits.";st.sform={name:v["s-name"],phone:v["s-phone"],shop:v["s-shop"],state:v["s-state"],nin:v["s-nin"],acct:v["s-acct"],errors:er};
  if(!Object.keys(er).length){st.seller={status:"pending_kyc",shop:v["s-shop"],nin4:v["s-nin"].slice(-4),acct4:v["s-acct"].slice(-4),listings:[]};toast("Application submitted");go("dash")}else{render();document.querySelector('[aria-invalid="true"]')?.focus()}}
 if(k==="listing"){const er={};if(!v["l-name"].trim())er.name="Enter a product name.";const price=+String(v["l-price"]).replace(/[^\d]/g,"");if(!price)er.price="Enter a price in naira.";st.lform={...v,name:v["l-name"],price:v["l-price"],cat:v["l-cat"],cond:v["l-cond"],errors:er};
  if(!Object.keys(er).length){const id="v"+Date.now();const cat=CATS.find(c=>c.name===v["l-cat"]).slug;S[id]={name:st.seller.shop,type:"vendor"};st.products.push({id,name:v["l-name"],brand:v["l-name"].split(" ")[0],cat,sub:"",spec:"Listed by "+st.seller.shop,cond:{New:"new","UK-used":"uk_used",Refurbished:"refurbished"}[v["l-cond"]],price,was:0,rating:5,reviews:0,seller:id,stock:"in",badge:"new"});st.seller.listings.push(id);st.lform=null;toast("Listing live on Market — search for it there")}render()}
});
render();
</script>
