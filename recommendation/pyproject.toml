[project]
name = "techshop-recs"
version = "0.1.0"
description = "TechShop recommendation system (batch training + optional live scoring). Own database; never touches Go's."
readme = "README.md"
requires-python = ">=3.13"
# Libraries from the approved plan (docs/recommendations.md §9). Not installed yet:
# run `uv sync` when work starts. Only a driver for its OWN database (recs-postgres).
dependencies = [
  "polars", "numpy", "scipy", "scikit-learn", "implicit", "gensim", "lightgbm",
  "torch",
  "psycopg[binary]",  # its own private Postgres (recs-postgres) only
  "pydantic", "pydantic-settings", "httpx", "typer", "pyyaml",
]

[project.optional-dependencies]
serving = ["fastapi", "uvicorn"]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
techshop-recs = "techshop_recs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techshop_recs"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
