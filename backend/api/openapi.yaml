components:
  schemas:
    AcceptInviteRequest:
      additionalProperties: false
      properties:
        password:
          maxLength: 128
          minLength: 10
          type: string
        token:
          minLength: 20
          type: string
      required:
        - token
        - password
      type: object
    AccountLedger:
      additionalProperties: false
      properties:
        balanceKobo:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/FinanceAccountLedgerRow"
          type:
            - array
            - "null"
        page:
          $ref: "#/components/schemas/Page"
      required:
        - balanceKobo
        - items
        - page
      type: object
    Action:
      additionalProperties: false
      properties:
        accuracyM:
          format: float
          type: number
        clientEventId:
          description: Generated on the device; makes the action idempotent
          type: string
        jobId:
          description: Required in batch sync; taken from the path for single actions
          type: string
        kind:
          enum:
            - picked_up
            - en_route
            - attempt_failed
            - delivered
            - note
          type: string
        labelCode:
          description: "picked_up: the scanned parcel label"
          maxLength: 40
          type: string
        latitude:
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        note:
          maxLength: 500
          type: string
        occurredAt:
          format: date-time
          type: string
        offline:
          description: Recorded without signal (photo proof becomes photo_offline)
          type: boolean
        otp:
          description: "delivered: the customer's delivery code"
          pattern: ^[0-9]{6}$
          type: string
        photoFileId:
          description: "delivered: photo proof (required when there's no code)"
          type: string
        reason:
          enum:
            - customer_unreachable
            - customer_refused
            - wrong_address
            - rescheduled
            - unsafe
            - other
            - ""
          type: string
        recipientName:
          maxLength: 80
          type: string
      required:
        - clientEventId
        - kind
        - occurredAt
      type: object
    AddCartItemRequest:
      additionalProperties: false
      properties:
        listingId:
          type: string
        quantity:
          format: int32
          maximum: 50
          minimum: 1
          type: integer
        replace:
          description: Set the quantity instead of adding to it
          type: boolean
      required:
        - listingId
        - quantity
      type: object
    AddressInput:
      additionalProperties: false
      properties:
        city:
          maxLength: 80
          minLength: 2
          type: string
        isDefault:
          type: boolean
        label:
          maxLength: 40
          type: string
        landmark:
          maxLength: 200
          type: string
        latitude:
          format: double
          type: number
        lga:
          maxLength: 80
          type: string
        line1:
          maxLength: 200
          minLength: 3
          type: string
        line2:
          maxLength: 200
          type: string
        longitude:
          format: double
          type: number
        phone:
          description: Nigerian mobile number
          type: string
        recipientName:
          maxLength: 120
          minLength: 2
          type: string
        stateCode:
          examples:
            - LA
          pattern: ^[A-Z]{2}$
          type: string
      required:
        - recipientName
        - phone
        - line1
        - city
        - stateCode
      type: object
    ApproveCampaignRequest:
      additionalProperties: false
      properties:
        sendAt:
          description: "Approve only: when to send (default now)"
          format: date-time
          type: string
      type: object
    CampaignInput:
      additionalProperties: false
      properties:
        channels:
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
          uniqueItems: true
        exclusions:
          $ref: "#/components/schemas/Exclusions"
        holdoutPct:
          default: 5
          format: double
          maximum: 50
          minimum: 0
          type: number
        linkUrl:
          description: Tracked click target (techshop.ng only)
          pattern: ^https://([a-z0-9-]+\.)*techshop\.ng(/.*)?$
          type: string
        name:
          maxLength: 120
          minLength: 3
          type: string
        segmentId:
          type: string
        variants:
          items:
            $ref: "#/components/schemas/VariantInput"
          maxItems: 8
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - segmentId
        - channels
        - exclusions
        - variants
      type: object
    CampaignView:
      additionalProperties: false
      properties:
        abTest: {}
        approvedAt:
          format: date-time
          type:
            - string
            - "null"
        approvedBy:
          type: string
        channels:
          items:
            type: string
          type:
            - array
            - "null"
        costEstimateKobo:
          format: int64
          type:
            - integer
            - "null"
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        exclusions: {}
        holdoutPct:
          format: double
          type: number
        id:
          type: string
        name:
          type: string
        scheduledAt:
          format: date-time
          type:
            - string
            - "null"
        segmentId:
          type: string
        stats:
          $ref: "#/components/schemas/MarketingCampaignStatsRow"
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
        variants:
          items:
            $ref: "#/components/schemas/MarketingCampaignVariant"
          type:
            - array
            - "null"
      required:
        - variants
        - stats
        - id
        - name
        - status
        - segmentId
        - exclusions
        - channels
        - scheduledAt
        - holdoutPct
        - abTest
        - costEstimateKobo
        - createdBy
        - approvedBy
        - approvedAt
        - createdAt
        - updatedAt
      type: object
    CancelCampaignRequest:
      additionalProperties: false
      properties:
        sendAt:
          description: "Approve only: when to send (default now)"
          format: date-time
          type: string
      type: object
    CarrierWebhookResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    CartView:
      additionalProperties: false
      properties:
        cartToken:
          description: Guest cart token; send it back in X-Cart-Token
          type: string
        couponCode:
          type: string
        couponKobo:
          format: int64
          type: integer
        deliveryKobo:
          format: int64
          type: integer
        discountKobo:
          format: int64
          type: integer
        freeDelivery:
          type: boolean
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type:
            - array
            - "null"
        itemsKobo:
          description: Sum of line gross amounts (VAT-inclusive)
          format: int64
          type: integer
        lines:
          items:
            $ref: "#/components/schemas/Line"
          type:
            - array
            - "null"
        priceHash:
          description: Send back with POST /orders; a different hash means prices changed
          type: string
        problems:
          items:
            type: string
          type:
            - array
            - "null"
        promotion:
          description: Name of the automatic promotion applied
          type: string
        purchasable:
          type: boolean
        shipState:
          type: string
        totalKobo:
          format: int64
          type: integer
        vatKobo:
          description: VAT included in the total (TechShop's own items)
          format: int64
          type: integer
      required:
        - lines
        - groups
        - itemsKobo
        - discountKobo
        - deliveryKobo
        - vatKobo
        - totalKobo
        - couponKobo
        - freeDelivery
        - shipState
        - priceHash
        - problems
        - purchasable
