    ToggleSavedResponse:
      additionalProperties: false
      properties:
        saved:
          type: boolean
      required:
        - saved
      type: object
    TokenPair:
      additionalProperties: false
      properties:
        accessExpiresAt:
          format: date-time
          type: string
        accessToken:
          type: string
        refreshExpiresAt:
          format: date-time
          type: string
        refreshToken:
          type: string
        sessionId:
          type: string
        userId:
          type: string
      required:
        - accessToken
        - accessExpiresAt
        - refreshToken
        - refreshExpiresAt
        - sessionId
        - userId
      type: object
    TrackEventsRequest:
      additionalProperties: false
      properties:
        anonymousId:
          type: string
        app:
          enum:
            - market
            - wholesale
            - customer_app
          type: string
        deviceClass:
          enum:
            - mobile
            - tablet
            - desktop
            - ""
          type: string
        events:
          items:
            $ref: "#/components/schemas/Event"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        sessionId:
          maxLength: 64
          type: string
        stateCode:
          pattern: ^([A-Z]{2})?$
          type: string
      required:
        - anonymousId
        - app
        - events
      type: object
    TrackEventsResponse:
      additionalProperties: false
      properties:
        accepted:
          format: int64
          type: integer
        dropped:
          description: Events dropped for lack of consent
          format: int64
          type: integer
      required:
        - accepted
        - dropped
      type: object
    Tracking:
      additionalProperties: false
      properties:
        history:
          items:
            $ref: "#/components/schemas/Item8"
          type:
            - array
            - "null"
        orderNumber:
          type: string
        parcels:
          items:
            $ref: "#/components/schemas/Item7"
          type:
            - array
            - "null"
        placedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
        - orderNumber
        - status
        - placedAt
        - parcels
        - history
      type: object
    TransferAccount:
      additionalProperties: false
      properties:
        accountNumber:
          type: string
        amountKobo:
          format: int64
          type: integer
        bankName:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - accountNumber
        - bankName
        - amountKobo
        - expiresAt
      type: object
    Understood:
      additionalProperties: false
      properties:
        condition:
          type: string
        maxPrice:
          description: Kobo
          format: int64
          type: integer
        minPrice:
          description: Kobo
          format: int64
          type: integer
        notes:
          description: Human-readable rewrites, e.g. tokunbo → UK-used
          items:
            type: string
          type:
            - array
            - "null"
        text:
          description: Search terms after synonyms
          type: string
      required:
        - text
      type: object
    UnsubOutBody:
      additionalProperties: false
      properties:
        channel:
          type: string
        unsubscribed:
          type: boolean
      required:
        - channel
        - unsubscribed
      type: object
    UpdateCartItemRequest:
      additionalProperties: false
      properties:
        quantity:
          format: int32
          maximum: 50
          minimum: 0
          type: integer
      required:
        - quantity
      type: object
    UpdateMeRequest:
      additionalProperties: false
      properties:
        firstName:
          maxLength: 80
          minLength: 1
          type: string
        lastName:
          maxLength: 80
          minLength: 1
          type: string
        marketingOptIn:
          type: boolean
      type: object
    UserSummary:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        phone:
          description: Masked
          type: string
        status:
          type: string
      required:
        - id
        - name
        - status
        - createdAt
      type: object
    VariantInput:
      additionalProperties: false
      properties:
        body:
          description: Plain text with {{first_name}}, {{coupon}} and {{link}}
          maxLength: 1000
          type: string
        channel:
          enum:
            - sms
            - email
            - push
          type: string
        label:
          description: A, B, …
          pattern: ^[A-Z]$
          type: string
        sharePct:
          format: double
          maximum: 100
          minimum: 1
          type: number
        subject:
          maxLength: 150
          type: string
        templateVersionId:
          type: string
      required:
        - label
        - channel
        - sharePct
      type: object
    VerifyNewDeviceOtpRequest:
      additionalProperties: false
      properties:
        appVersion:
          maxLength: 40
          type: string
        audience:
          enum:
            - market
            - wholesale
            - seller
            - staff
            - customer_app
            - logistics
          type: string
        challengeId:
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        deviceId:
          maxLength: 128
          type: string
        deviceName:
          maxLength: 120
          type: string
        mfaToken:
          type: string
        platform:
          enum:
            - web
            - ios
            - android
          type: string
      required:
        - mfaToken
        - challengeId
        - code
        - audience
      type: object
    VerifyOTPResult:
      additionalProperties: false
      properties:
        signupToken:
          description: Send with your name to /auth/otp/signup (valid 15 minutes)
          type: string
        status:
          enum:
            - signed_in
            - needs_profile
          type: string
        tokens:
          $ref: "#/components/schemas/TokenPair"
      required:
        - status
      type: object
    VerifyOtpRequest:
      additionalProperties: false
      properties:
        appVersion:
          maxLength: 40
          type: string
        audience:
          enum:
            - market
            - wholesale
            - seller
            - staff
            - customer_app
            - logistics
          type: string
        challengeId:
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        deviceId:
          maxLength: 128
          type: string
        deviceName:
          maxLength: 120
          type: string
        platform:
          enum:
            - web
            - ios
            - android
          type: string
      required:
        - challengeId
        - code
        - audience
      type: object
    VerifyRecoveryCodeRequest:
      additionalProperties: false
      properties:
        appVersion:
          maxLength: 40
          type: string
        audience:
          enum:
            - market
            - wholesale
            - seller
            - staff
            - customer_app
            - logistics
          type: string
        code:
          maxLength: 9
          minLength: 9
          type: string
        deviceId:
          maxLength: 128
          type: string
        deviceName:
          maxLength: 120
          type: string
        mfaToken:
          type: string
        platform:
          enum:
            - web
            - ios
            - android
          type: string
      required:
        - mfaToken
        - code
        - audience
      type: object
    VerifyTotpRequest:
      additionalProperties: false
      properties:
        appVersion:
          maxLength: 40
          type: string
        audience:
          enum:
            - market
            - wholesale
            - seller
            - staff
            - customer_app
            - logistics
          type: string
        code:
          pattern: ^[0-9]{6}$
          type: string
        deviceId:
          maxLength: 128
          type: string
        deviceName:
          maxLength: 120
          type: string
        mfaToken:
          type: string
        platform:
          enum:
            - web
            - ios
            - android
          type: string
      required:
        - mfaToken
        - code
        - audience
      type: object
    WmsCreateManifestRequest:
      additionalProperties: false
      properties:
        carrierId:
          type: string
        labels:
          items:
            type: string
          maxItems: 200
          minItems: 1
          type:
            - array
            - "null"
        riderId:
          type: string
        warehouseId:
          type: string
      required:
        - warehouseId
        - labels
      type: object
    WmsFulfilmentShippingResponse:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/FulfilmentShipmentEvent"
          type:
            - array
            - "null"
        parcels:
          items:
            $ref: "#/components/schemas/FulfilmentParcel"
          type:
            - array
            - "null"
        shipments:
          items:
            $ref: "#/components/schemas/FulfilmentShipment"
          type:
            - array
            - "null"
      required:
        - parcels
        - shipments
        - events
      type: object
    WmsPackRequest:
      additionalProperties: false
      properties:
        boxCode:
          maxLength: 20
          type: string
        fulfilmentId:
          type: string
        weightGrams:
          format: int32
          maximum: 100000
          minimum: 1
          type: integer
      required:
        - fulfilmentId
        - weightGrams
      type: object
    WmsReleaseWaveRequest:
      additionalProperties: false
      properties:
        warehouseId:
          type: string
        zone:
          maxLength: 20
          type: string
      required:
        - warehouseId
      type: object
    WmsScanRequest:
      additionalProperties: false
      properties:
        orderLineId:
          type: string
        quantity:
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        serial:
          description: IMEI or serial number
          maxLength: 40
          type: string
      required:
        - orderLineId
        - quantity
      type: object
    WmsScanResponse:
      additionalProperties: false
      properties:
        item:
          $ref: "#/components/schemas/FulfilmentPickListItem"
        listComplete:
          type: boolean
      required:
        - item
        - listComplete
      type: object
    WmsSignManifestRequest:
      additionalProperties: false
      properties:
        signedByName:
          maxLength: 80
          minLength: 2
          type: string
      required:
        - signedByName
      type: object
    WmsUpsertCarrierRequest:
      additionalProperties: false
      properties:
        code:
          pattern: ^[a-z0-9_]{2,20}$
          type: string
        isActive:
          type: boolean
        name:
          maxLength: 80
          minLength: 2
          type: string
      required:
        - code
        - name
        - isActive
      type: object
    ZoneIn:
      additionalProperties: false
      properties:
        isActive:
          type: boolean
        lgas:
          description: Empty = the whole state
          items:
            type: string
          type:
            - array
            - "null"
        name:
          maxLength: 80
          minLength: 2
          type: string
        stateCode:
          pattern: ^[A-Z]{2}$
          type: string
      required:
        - name
        - stateCode
        - lgas
        - isActive
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: TechShop API. Money is integer kobo; errors are application/problem+json with a stable `code`.
  title: TechShop API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/auth/invite/accept:
    post:
      operationId: acceptInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteStart"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: "Staff: set a password and start authenticator setup"
      tags:
        - Auth
  /api/v1/auth/invite/confirm:
    post:
      operationId: confirmInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmInviteResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: "Staff: confirm the first authenticator code and sign in"
      tags:
        - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign out this device
      tags:
        - Auth
  /api/v1/auth/mfa/otp:
    post:
      operationId: verifyNewDeviceOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyNewDeviceOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Finish a seller sign-in on a new device
      tags:
        - Auth
  /api/v1/auth/mfa/recovery:
    post:
      operationId: verifyRecoveryCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRecoveryCodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Finish sign-in with a recovery code
      tags:
        - Auth
  /api/v1/auth/mfa/step-up:
    post:
      operationId: stepUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Re-confirm your authenticator before a sensitive action
      tags:
        - Auth
  /api/v1/auth/mfa/totp:
    post:
      operationId: verifyTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTotpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Finish sign-in with an authenticator code
      tags:
        - Auth
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOtpResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Text a 6-digit sign-in code
      tags:
        - Auth
  /api/v1/auth/otp/signup:
    post:
      operationId: completeSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Create the account for a verified number
      tags:
        - Auth
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOTPResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the code and sign in
      tags:
        - Auth
  /api/v1/auth/password:
    post:
      operationId: passwordLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with email or phone and password
      tags:
        - Auth
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokensRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Rotate the refresh token
      tags:
        - Auth
  /api/v1/best-sellers:
    get:
      operationId: bestSellers
      parameters:
        - explode: false
          in: query
          name: q
          schema:
            maxLength: 120
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
        - description: Comma-separated brand slugs
          explode: false
          in: query
          name: brand
          schema:
            description: Comma-separated brand slugs
            type: string
        - description: "Comma-separated: new,uk_used,refurbished,open_box"
          explode: false
          in: query
          name: condition
          schema:
            description: "Comma-separated: new,uk_used,refurbished,open_box"
            type: string
        - explode: false
          in: query
          name: sellerType
          schema:
            enum:
              - first_party
              - business
              - individual
              - ""
            type: string
        - description: Kobo
          explode: false
          in: query
          name: minPrice
          schema:
            description: Kobo
            format: int64
            type: integer
        - description: Kobo
          explode: false
          in: query
          name: maxPrice
          schema:
            description: Kobo
            format: int64
            type: integer
        - explode: false
          in: query
          name: inStock
          schema:
            type: boolean
        - explode: false
          in: query
          name: sort
          schema:
            enum:
              - relevance
              - price_asc
              - price_desc
              - rating
              - discount
              - best_selling
              - ""
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - description: Include ranking scores
          explode: false
          in: query
          name: explain
          schema:
            description: Include ranking scores
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Best sellers (last 30 days)
      tags:
        - Catalogue
  /api/v1/brands:
    get:
      operationId: listBrands
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CatalogBrand"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Brands
      tags:
        - Catalogue
  /api/v1/cart:
    get:
      operationId: getCart
      parameters:
        - in: header
          name: X-Cart-Token
          schema:
            type: string
        - explode: false
          in: query
          name: coupon
          schema:
            maxLength: 40
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
          headers:
            X-Cart-Token:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The cart with live prices, promotions, delivery and problems
      tags:
        - Cart & checkout
  /api/v1/cart/items:
    post:
      operationId: addCartItem
      parameters:
        - in: header
          name: X-Cart-Token
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
          headers:
            X-Cart-Token:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a listing (guests get an X-Cart-Token)
      tags:
        - Cart & checkout
  /api/v1/cart/items/{id}:
    delete:
      operationId: removeCartItem
      parameters:
        - in: header
          name: X-Cart-Token
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
          headers:
            X-Cart-Token:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Remove a line
      tags:
        - Cart & checkout
    patch:
      operationId: updateCartItem
      parameters:
        - in: header
          name: X-Cart-Token
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
          headers:
            X-Cart-Token:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change a line's quantity (0 removes it)
      tags:
        - Cart & checkout
  /api/v1/cart/merge:
    post:
      operationId: mergeCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCartRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
          headers:
            X-Cart-Token:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
